<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres Katanas - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="container-fluid fondo-principal">
        <section class="container py-5">
            <h1 class="titulo-principal">Administración</h1>
            <p id="estado-admin" role="status" class="mt-3"></p>

            <div id="panel-admin" hidden>
                <nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Secciones del panel">
                    <button class="btn btn-outline-light" type="button" data-recurso="usuarios">Usuarios</button>
                    <button class="btn btn-outline-light" type="button" data-recurso="productos">Productos</button>
                    <button class="btn btn-outline-light" type="button" data-recurso="ventas">Ventas</button>
                </nav>
                <button id="nuevo-registro" type="button" class="btn btn-katana mb-3">Agregar registro</button>

                <form id="form-admin" class="card card-producto p-4 mb-4" hidden>
                    <h2 id="titulo-form-admin" class="h4"></h2>
                    <div id="campos-admin" class="row g-3 mb-3"></div>
                    <p id="estado-form-admin" role="alert" class="mb-2"></p>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-katana">Guardar</button>
                        <button id="cancelar-admin" type="button" class="btn btn-outline-light">Cancelar</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-dark table-striped align-middle">
                        <caption id="titulo-listado" class="caption-top text-white"></caption>
                        <thead id="encabezado-admin"></thead>
                        <tbody id="listado-admin"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/carritoStorage.js"></script>
    <script src="../componentes/navbar.js"></script>
    <script src="../componentes/cards.js"></script>
    <script src="../componentes/footer.js"></script>
    <script type="module" src="../js/admin.js"></script>
</body>
</html>
