<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres Katanas - Electrónica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="container-fluid fondo-principal">
        <section class="container text-center py-5">
            <h1 class="titulo-principal">Electronica</h1>
        </section>

        <section class="container pb-5">
            <div class="mx-auto mb-4" style="max-width: 24rem">
                <label class="form-label" for="categoria">Categoría</label>
                <select class="form-select" id="categoria"><option value="">Todas las categorías</option></select>
            </div>
            <p id="estado-catalogo" class="text-center" role="status">Cargando catálogo…</p>
            <div class="row justify-content-center g-4" id="productos" data-categoria="electronica"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/titulo.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/carritoStorage.js"></script>
    <script src="../componentes/navbar.js"></script>
    <script src="../componentes/cards.js"></script>
    <script src="../componentes/footer.js"></script>
    <script type="module" src="../js/catalogo.js"></script>
</body>
</html>
